[project]
name = "virtual-wallet-wallet"
version = "0.1.0"
description = "Wallet Service (Stage 1: health-only skeleton)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0.32,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]

[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
