[project]
name = "virtual-wallet-gateway"
version = "0.1.0"
description = "API Gateway: routing, JWT verification, rate limiting"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pyjwt>=2.9,<3",
  "redis>=5.0,<6",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "respx>=0.21,<1",
  "fakeredis>=2.25,<3",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.uv]
# Not a distributable package: uv installs dependencies only.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Tests use literal tokens and obviously-not-secret values on purpose.
"tests/*" = ["S105", "S106", "S107"]

[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

# Test fixtures intentionally skip annotations for HTTP/RESPX objects; the
# application code is checked strictly.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
