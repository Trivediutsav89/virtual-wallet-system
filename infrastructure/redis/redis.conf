# ---------------------------------------------------------------------------
# Redis — rate limiting only (see README.md in this directory)
#
# Counters are disposable, so persistence is disabled. Memory is capped so a
# runaway key cannot take the host down.
# ---------------------------------------------------------------------------

bind 0.0.0.0
port 6379

# The port is not published outside the compose network and no durable data
# lives here. Enable requirepass before any non-local deployment.
protected-mode no

maxmemory 128mb
maxmemory-policy allkeys-lru

# No persistence: rate-limit windows must not survive a restart.
save ""
appendonly no

timeout 0
tcp-keepalive 300

loglevel notice
databases 16
